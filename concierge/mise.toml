# mise (https://mise.jdx.dev) config for concierge/.
#
# Scoped to this subproject only — sekaimate is a Unity C# monorepo and this
# file must not impose a Go/Kubernetes toolchain on the rest of the tree.
#
# Versions pinned below are the ones concierge was actually built and
# verified with; see docs/concierge/verification.md §1 and go.mod.
#
# podman is NOT managed here: it is a system prerequisite installed via
# Podman Desktop (/opt/podman/bin) and drives the VM that minikube/Agones
# run in. See docs/concierge/implementation.md.

min_version = "2024.9.5"

[tools]
go = "1.26.5"
kubectl = "1.36.4"
minikube = "1.38.1"

# --- build / test -----------------------------------------------------

[tasks.build]
description = "go build ./..."
run = "go build ./..."

[tasks.test]
description = "go test ./..."
run = "go test ./..."

[tasks.vet]
description = "go vet ./..."
run = "go vet ./..."

[tasks.fmt]
description = "Check gofmt formatting (gofmt -l .); prints nothing if clean"
run = "gofmt -l ."

[tasks.check]
description = "Run build, test, vet and the fmt check together"
depends = ["build", "test", "vet", "fmt"]

[tasks.generate]
description = "Regenerate OpenAPI server code (server.gen.go) from api/openapi.yaml via the oapi-codegen tool directive; see internal/api/doc.go"
run = "go generate ./..."

# --- container image ---------------------------------------------------

[tasks.image]
description = "Build the concierge image directly into minikube's image store (no registry required)"
run = "minikube image build -t concierge:dev ."

# --- local cluster (minikube + Agones) ----------------------------------

[tasks.minikube-start]
description = "Start the local minikube cluster with the flags verified in docs/concierge/verification.md §1"
run = "minikube start --driver=podman --cpus=4 --memory=6g --container-runtime=containerd"

[tasks.agones-install]
description = "Install Agones v1.60.0 (release-1.60.0 static manifest) into agones-system, working around the CRD's x-kubernetes-patch-* fields, and wait for its pods to become ready"
depends = ["minikube-start"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
kubectl create namespace agones-system
curl -sL https://raw.githubusercontent.com/googleforgames/agones/release-1.60.0/install/yaml/install.yaml \
  -o agones-install.yaml
grep -v "x-kubernetes-patch-strategy:\|x-kubernetes-patch-merge-key:" agones-install.yaml \
  > agones-install-fixed.yaml
kubectl apply --server-side --force-conflicts -f agones-install-fixed.yaml
kubectl wait --for=condition=Ready pods --all -n agones-system --timeout=300s
'''
