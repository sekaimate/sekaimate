# Public single-node k3s overlay, applied by tools/k3s-up.sh.
#
# Differences from 20-deployment-dev.yaml: the images come from the host's
# container engine (imported into k3s containerd, so they are never pulled),
# the browser endpoints are HTTPS/WSS names instead of loopback ports, and
# manual meetings stay disabled. The endpoint values live in the
# concierge-endpoints ConfigMap, which tools/k3s-up.sh renders from the
# domains in .env.local.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: concierge-data
  namespace: basis
  labels:
    app: concierge
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concierge
  namespace: basis
  labels:
    app: concierge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: concierge
  template:
    metadata:
      labels:
        app: concierge
    spec:
      serviceAccountName: concierge
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              if [ ! -f /data/appsettings.json ]; then
                cp /etc/concierge-seed/appsettings.json /data/appsettings.json
              fi
          volumeMounts:
            - name: config-seed
              mountPath: /etc/concierge-seed
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: concierge
          image: concierge:local
          # The image is imported into containerd by tools/k3s-up.sh; there is
          # no registry to pull it from.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: concierge-endpoints
          env:
            - name: NAMESPACE
              value: basis
            - name: BASIS_SSO_BROKER_CONFIG_PATH
              value: /data/appsettings.json
            - name: BASIS_CONTROL_PLANE_STORE_PATH
              value: /data/control-plane.json
            - name: ADMIN_UI_DIR
              value: /adminui
            - name: GAMESERVER_READY_TIMEOUT_SECONDS
              value: "120"
            - name: BASIS_WORLD_BEE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: concierge-world
                  key: password
            - name: BASIS_SSO_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: concierge-admin
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 5080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config-seed
          secret:
            secretName: concierge-config
        - name: data
          persistentVolumeClaim:
            claimName: concierge-data
