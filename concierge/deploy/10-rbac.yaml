# Least-privilege RBAC for concierge's internal/kube.Manager
# (docs/concierge/design.md §5, implementation.md phase-2 section):
# get/list/create/delete on Agones GameServers and on Secrets, scoped to
# the "basis" namespace only. No "update"/"patch" is granted: concierge
# never mutates a GameServer or its SSO Secret in place after creation
# (rotating keys means deleting the meeting and creating a new one), and it
# never touches any other namespace or resource kind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: concierge
  namespace: basis
  labels:
    app: concierge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: concierge
  namespace: basis
  labels:
    app: concierge
rules:
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: concierge
  namespace: basis
  labels:
    app: concierge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: concierge
subjects:
  - kind: ServiceAccount
    name: concierge
    namespace: basis
---
# Agones only lets GameServer pods run in the "default" namespace out of the
# box: its static/Helm install only creates the "agones-sdk" ServiceAccount
# (and a RoleBinding to the cluster-wide "agones-sdk" ClusterRole, which the
# Agones install itself creates) in "default". Every additional namespace
# GameServers run in — here, "basis" — needs its own copy of both, or the
# Agones controller fails to create the GameServer's Pod with
# `pods "basis-<id>" is forbidden: error looking up service account
# basis/agones-sdk: serviceaccount "agones-sdk" not found` (this is what the
# GameServer's own SDK sidecar authenticates as against the Agones SDK HTTP
# gateway, not concierge's own ServiceAccount above).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agones-sdk
  namespace: basis
  labels:
    app: concierge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agones-sdk-access
  namespace: basis
  labels:
    app: concierge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agones-sdk
subjects:
  - kind: ServiceAccount
    name: agones-sdk
    namespace: basis
