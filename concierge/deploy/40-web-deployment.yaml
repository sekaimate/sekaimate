# WebGL client static server for local Kubernetes/minikube.
# Build concierge/web.Dockerfile from the repository root and load the image
# into minikube before applying this manifest:
#
#   ./tools/build-web.sh --dev Build/Web
#   minikube image build -t concierge-web:dev -f concierge/web.Dockerfile .
#   kubectl apply -f concierge/deploy/40-web-deployment.yaml
#
# The Node server is used instead of a generic static server because Unity's
# compressed assets need Content-Encoding, WebAssembly needs its MIME type,
# and BEE files use HTTP Range requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concierge-web
  namespace: basis
  labels:
    app: concierge-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: concierge-web
  template:
    metadata:
      labels:
        app: concierge-web
    spec:
      containers:
        - name: web
          image: concierge-web:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4173
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: concierge-web
  namespace: basis
  labels:
    app: concierge-web
spec:
  # Keep this as a ClusterIP: local browser access uses a stable port-forward,
  # which is also a loopback origin accepted by Concierge's webJoinURL check.
  # For a shared cluster, put an HTTPS ingress/reverse proxy in front of this
  # Service and use that public origin in Broker.AllowedWebOrigins.
  type: ClusterIP
  selector:
    app: concierge-web
  ports:
    - name: http
      port: 4173
      targetPort: http
      protocol: TCP
