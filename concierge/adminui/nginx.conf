events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            return 302 /admin;
        }

        # Vite builds with base=/admin/. Keep the browser URL stable for SPA routes.
        location = /admin {
            root /usr/share/nginx/html;
            try_files /admin/index.html =404;
        }

        location /admin/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Keep the participant shell static, but send its token-scoped data endpoints to
        # Concierge for validation and no-store responses.
        location ~ ^/join/[^/]+/(details|config|web-config|web-manifest|manifest|open)$ {
            proxy_pass http://concierge:5080;
            proxy_no_cache 1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Participant pages are part of the same static UI build. API details remain on
        # Concierge so the invitation token is validated server-side before rendering actions.
        location /join/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /join.html;
        }

        location = /join.html {
            root /usr/share/nginx/html;
            try_files /join.html =404;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # The browser only sees /api/. Nginx removes that prefix before calling Concierge.
        location /api/ {
            proxy_pass http://concierge:5080/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://concierge:5080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
