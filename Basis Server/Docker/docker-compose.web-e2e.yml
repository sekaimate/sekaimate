services:
  basis-server:
    environment:
      Password: ${BASIS_SERVER_PASSWORD:-test-password}
      BasisFirstAdmin: ${BASIS_FIRST_ADMIN:-did:key:basis-local-e2e-admin}
      WebSocketEnabled: "true"
      WebSocketPort: 4297
      WebSocketPath: /basis
      WebSocketServerInfoPath: /server-info
      WebSocketAllowedOrigins: ${BASIS_WEBSOCKET_ALLOWED_ORIGINS:-http://127.0.0.1:4173,http://localhost:4173}
      WebSocketUseTls: "true"
      WebSocketCertificatePath: /run/certs/basis-local.pem
      WebSocketCertificateKeyPath: /run/certs/basis-local-key.pem
      WorldsLocked: "false"
    volumes:
      - ${BASIS_SERVER_CERTIFICATE_DIRECTORY:?set BASIS_SERVER_CERTIFICATE_DIRECTORY}:/run/certs:ro
