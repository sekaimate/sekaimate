services:
  basis-server:
    environment:
      WebSocketEnabled: "true"
      WebSocketPort: 4297
      WebSocketPath: /basis
      WebSocketServerInfoPath: /server-info
      WebSocketAllowedOrigins: ${BASIS_WEBSOCKET_ALLOWED_ORIGINS:?set BASIS_WEBSOCKET_ALLOWED_ORIGINS}
      WebSocketUseTls: "true"
      WebSocketCertificatePath: /run/certs/basis-server.pfx
      WebSocketCertificatePassword: ${BASIS_SERVER_CERTIFICATE_PASSWORD:?set BASIS_SERVER_CERTIFICATE_PASSWORD}
    ports:
      - "443:4297/tcp"
    volumes:
      - ${BASIS_SERVER_CERTIFICATE_PATH:?set BASIS_SERVER_CERTIFICATE_PATH}:/run/certs/basis-server.pfx:ro
