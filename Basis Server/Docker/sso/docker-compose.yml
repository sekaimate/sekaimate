services:
  concierge:
    build:
      context: ../../../concierge
      dockerfile: Dockerfile.compose
    image: concierge:local
    container_name: concierge
    restart: unless-stopped
    env_file: [.env]
    environment:
      BASIS_SERVER_CONFIG: /basis-server-config/config.xml
      BASIS_SSO_BROKER_CONFIG_PATH: /state/appsettings.json
      BASIS_CONTROL_PLANE_STORE_PATH: /state/control-plane.json
      BASIS_MEETING_PUBLIC_HOST: ${BASIS_MEETING_PUBLIC_HOST}
      SetPort: ${SetPort:-4296}
      Password: ${Password}
      BASIS_SSO_ADMIN_TOKEN: ${BASIS_SSO_ADMIN_TOKEN}
      BASIS_SSO_ALLOW_MISSING_SERVER_KEYS: ${BASIS_SSO_ALLOW_MISSING_SERVER_KEYS:-false}
      LISTEN_ADDR: 0.0.0.0:5080
    volumes:
      - ../config:/basis-server-config:ro
      - ./broker:/state
    networks: [sso]

  concierge-gateway:
    build:
      context: ../../../concierge/adminui
    image: concierge-gateway:local
    container_name: concierge-gateway
    restart: unless-stopped
    depends_on: [concierge]
    ports:
      - "127.0.0.1:${BASIS_SSO_GATEWAY_PORT:-5081}:443"
    volumes:
      - ./certs:/etc/nginx/certs
    networks: [sso]

networks:
  sso:
