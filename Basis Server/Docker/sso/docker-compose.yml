services:
  basis-sso-broker:
    build:
      context: ../../../Basis/Tools/BasisSsoBroker
    image: basis-sso-broker:local
    container_name: basis-sso-broker
    restart: unless-stopped
    env_file: [.env]
    environment:
      BASIS_SERVER_CONFIG: /basis-server-config/config.xml
      BASIS_SSO_BROKER_CONFIG_PATH: /state/appsettings.json
      BASIS_CONTROL_PLANE_STORE_PATH: /state/control-plane.json
      BASIS_MEETING_PUBLIC_HOST: ${BASIS_MEETING_PUBLIC_HOST}
      SetPort: ${SetPort:-4296}
      Password: ${Password}
      BASIS_SSO_ADMIN_TOKEN: ${BASIS_SSO_ADMIN_TOKEN}
      BASIS_SSO_GOOGLE_CLIENT_SECRET: ${BASIS_SSO_GOOGLE_CLIENT_SECRET}
    volumes:
      - ../config:/basis-server-config:ro
      - ./broker:/state
    networks: [sso]

  basis-sso-admin:
    build:
      context: ../../../Basis/Tools/BasisSsoBroker/AdminUi
    image: basis-sso-admin:local
    container_name: basis-sso-admin
    restart: unless-stopped
    depends_on: [basis-sso-broker]
    ports:
      - "127.0.0.1:${BASIS_SSO_GATEWAY_PORT:-5081}:8080"
    networks: [sso]

networks:
  sso:
