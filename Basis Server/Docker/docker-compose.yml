services:
  basis-server:
    build:
      context: ../
      dockerfile: Docker/Dockerfile
    image: basis-server:latest
    container_name: basis-server
    restart: unless-stopped
    environment:
      SetPort: 4296
      HealthCheckPort: 10666
      PromethusPort: 1234
      Password: default_password
      PeerLimit: 1024
      EnableStatistics: true
      EnableConsole: false
    ports:
      - "4296:4296/udp"
      - "4297:4297/tcp"
      - "10666:10666/tcp"
      - "1234:1234/tcp"
    volumes:
      - ${BASIS_SERVER_INITIAL_RESOURCES_DIR:-./initialresources}:/app/initialresources:ro
      - ${BASIS_SERVER_CONFIG_DIR:-./config}:/app/config
