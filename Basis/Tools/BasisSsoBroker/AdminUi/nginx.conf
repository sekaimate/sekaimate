events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name _;

        # Vite builds with base=/admin/. Keep the browser URL stable for SPA routes.
        location = /admin {
            return 308 /admin/;
        }

        location /admin/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # The browser only sees /api/. Nginx removes that prefix before calling broker.
        location /api/ {
            proxy_pass http://basis-sso-broker:5080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            proxy_pass http://basis-sso-broker:5080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
