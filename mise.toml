[tools]
node="latest"
pnpm = "11"

[tasks."build:web:dev"]
description = "Build the reusable Development WebGL build"
run = "./tools/build-web.sh --dev"

[tasks."build:web"]
description = "Build the clean Release WebGL build"
run = "./tools/build-web.sh"

[tasks."serve:web"]
description = "Serve the Development WebGL build and world BEE"
run = "./tools/serve-web.sh --dev"

[tasks."server:up"]
description = "Build and start the local Basis Server with WebSocket support"
run = "bash ./tools/server-up.sh"

[tasks."server:down"]
description = "Stop the local Basis Server"
run = 'docker compose -f "Basis Server/Docker/docker-compose.yml" -f "Basis Server/Docker/docker-compose.local-web.yml" down'

[tasks."server:logs"]
description = "Follow local Basis Server logs"
run = 'docker compose -f "Basis Server/Docker/docker-compose.yml" -f "Basis Server/Docker/docker-compose.local-web.yml" logs -f basis-server'

[tasks."admin:up"]
description = "Build and start the SSO Broker and Admin UI"
run = 'docker compose -f "Basis Server/Docker/sso/docker-compose.yml" up -d --build'

[tasks."admin:down"]
description = "Stop the SSO Broker and Admin UI"
run = 'docker compose -f "Basis Server/Docker/sso/docker-compose.yml" down'

[tasks."admin:logs"]
description = "Follow SSO Broker and Admin UI logs"
run = 'docker compose -f "Basis Server/Docker/sso/docker-compose.yml" logs -f'

[tasks."admin:ui"]
description = "Run the SSO Admin UI development server"
run = "cd 'Basis/Tools/BasisSsoBroker/AdminUi' && vp run dev"

[tasks.dev]
description = "Reuse or build WebGL, start SSO, Basis Server, and the Web client"
run = "bash ./tools/ensure-web-dev-build.sh && mise run admin:up && mise run server:up && exec ./tools/serve-web.sh --dev"
